<!doctype html>
<html lang="en" data-theme="gg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#202225">
<meta name="description" content="Fortnite Dynamic Map — interactive Chapter 7 Season 4 map with the official island, exact locations, spawn filters, drop calculator, loot-route AI and saved routes.">
<title>Fortnite Dynamic Map</title>

<style>
:root{
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --disp:"Burbank Big Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
[data-theme=gg]{--bg:#2f3136;--bg2:#292b2f;--panel:#202225;--panel2:#2b2d31;--line:#36393f;--line2:#44474e;--text:#fff;--muted:#b9bbbe;--dim:#8e9297;--gold:#ffd60a;--gold2:#ffe45c;--ink:#1a1500;--arc:#4fe3ff;--danger:#ff4d4d;--ok:#3fcf5e;--warn:#ffb020;--tog:#3fcf5e;--shadow:0 8px 24px rgba(0,0,0,.45);--water:#2f3136;--chip:rgba(255,255,255,.08)}
[data-theme=boardroom]{--bg:#0c1117;--bg2:#10171f;--panel:#141c26;--panel2:#19232f;--line:#232f3e;--line2:#2f3e52;--text:#e6ebf1;--muted:#8e9bac;--dim:#617084;--gold:#d3ad58;--gold2:#f1d68e;--ink:#1a1408;--arc:#53b8c6;--danger:#e5655b;--ok:#5cc48b;--warn:#e7a948;--tog:#d3ad58;--shadow:0 12px 32px rgba(0,0,0,.38);--water:#0c1117;--chip:#1d2836}
[data-theme=arcane]{--bg:#0f0c1a;--bg2:#141024;--panel:#19142c;--panel2:#201a38;--line:#2c2548;--line2:#3b3260;--text:#ece8f8;--muted:#a097c0;--dim:#6f6795;--gold:#c9a8ff;--gold2:#e6d6ff;--ink:#1a0f33;--arc:#5fd6c6;--danger:#ff6b7f;--ok:#5fd69a;--warn:#f1b65a;--tog:#b48cff;--shadow:0 12px 34px rgba(0,0,0,.45);--water:#0f0c1a;--chip:#231d3d}
[data-theme=nitemare]{--bg:#140d0a;--bg2:#181009;--panel:#1d140f;--panel2:#251a13;--line:#36261b;--line2:#4a3424;--text:#f5ebe2;--muted:#b49d8a;--dim:#7d6a5b;--gold:#ff8f2e;--gold2:#ffc27a;--ink:#2a1200;--arc:#a771ff;--danger:#ff5a4f;--ok:#7bd36b;--warn:#ffb347;--tog:#ff8f2e;--shadow:0 12px 34px rgba(0,0,0,.5);--water:#140d0a;--chip:#2a1d15}
[data-theme=light]{--bg:#e9eaee;--bg2:#dfe1e6;--panel:#ffffff;--panel2:#f3f4f7;--line:#dcdfe5;--line2:#c9cdd5;--text:#17191c;--muted:#5a5f69;--dim:#878c96;--gold:#e0b500;--gold2:#f2cc1a;--ink:#1a1500;--arc:#0b8fb3;--danger:#d63a3a;--ok:#22a447;--warn:#c27c00;--tog:#22a447;--shadow:0 8px 22px rgba(20,24,30,.14);--water:#d5d8de;--chip:#eef0f3}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--arc)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.disp{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.01em;font-stretch:condensed}

/* ---------- header ---------- */
.topbar{flex:0 0 auto;height:48px;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);z-index:40;position:relative}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;padding:0;color:var(--text);min-width:0}
.brand-name{font-family:var(--disp);font-weight:900;font-size:22px;line-height:.92;font-stretch:condensed;white-space:nowrap;text-transform:uppercase;display:flex;flex-direction:column;text-align:left}
.brand-name small{font-size:10.5px;letter-spacing:.32em;color:var(--muted);font-weight:800}
.ricon{display:inline-grid;place-items:center;flex:0 0 auto}
.ricon img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.hero-logo{width:72px;height:72px;margin-bottom:8px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.brand-name b{color:var(--gold)}
.nav{display:flex;gap:2px;margin-left:auto;height:100%}
.nav button{background:none;border:0;padding:0 12px;color:var(--text);font-family:var(--disp);font-weight:800;font-size:15px;text-transform:uppercase;font-stretch:condensed;letter-spacing:.02em;position:relative;opacity:.82;display:flex;align-items:center;gap:6px}
.nav button:hover{opacity:1}
.nav button.on{opacity:1}
.nav button.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--gold);border-radius:3px 3px 0 0}
.nav svg{width:17px;height:17px;display:none}
.filters-btn{display:none;background:var(--gold);color:var(--ink);border:0;border-radius:8px;height:34px;padding:0 12px;font-family:var(--disp);font-weight:800;text-transform:uppercase;align-items:center;gap:6px}
.filters-btn svg{width:16px;height:16px}

/* ---------- views ---------- */
#views{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#v-map.on{display:flex;overflow:hidden}
.page{max-width:1180px;margin:0 auto;padding:22px 18px 40px}

/* ---------- common ---------- */
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;text-transform:uppercase;font-stretch:condensed;letter-spacing:.01em}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px}
h3{font-size:17px;color:var(--gold)}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack>*+*{margin-top:10px}
.sep{height:1px;background:var(--line);margin:16px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:8px;border:0;background:var(--chip);font-weight:700;font-size:14px;color:var(--text);white-space:nowrap;min-height:36px;transition:filter .12s,background .12s}
.btn:hover{background:rgba(255,255,255,.14)}
[data-theme=light] .btn:hover{background:#e2e5ea}
.btn.pri{background:var(--gold);color:var(--ink);font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:16px;font-stretch:condensed;letter-spacing:.02em}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;min-height:30px}
.btn.pri.sm{font-size:14px}
.btn.on{box-shadow:inset 0 0 0 2px var(--gold);color:var(--gold2)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}

.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.inp,select.inp{width:100%;padding:7px 10px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.1);min-height:36px;color:var(--text)}
[data-theme=light] .inp{background:#eceef2}
select.inp option{background:var(--panel);color:var(--text)}
.inp:focus{outline:none;border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}

.kpi{background:var(--panel2);border-radius:10px;padding:10px 12px}
.kpi .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.kpi .v{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1.1;font-stretch:condensed}
.kpi .s{font-size:12px;color:var(--dim)}
.kpi.gold .v{color:var(--gold)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.tag.gold{background:var(--gold);color:var(--ink)}
.tag.red{background:var(--danger);color:#fff}
.tag.arc{background:color-mix(in srgb,var(--arc) 22%,transparent);color:var(--arc)}
.tag.est{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:var(--gold)}
.bar.red i{background:var(--danger)}

/* switch (fortnite.gg style) */
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:999px;background:#72767d;transition:.18s}
.sw i::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw input:checked+i{background:var(--tog)}
.sw input:checked+i::after{transform:translateX(20px)}
.sw.master input:checked+i{background:var(--gold)}
.sw.sm{width:40px;height:22px}.sw.sm i::after{width:16px;height:16px}.sw.sm input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--arc);outline-offset:2px}

/* ---------- map view ---------- */
#sidebar{flex:0 0 360px;width:360px;background:var(--panel);display:flex;flex-direction:column;min-height:0;z-index:20;transition:margin-left .22s ease}
#sidebar.closed{margin-left:-360px}
.sb-top{padding:12px 12px 8px;display:flex;flex-direction:column;gap:10px;flex:0 0 auto}
.sb-scroll{flex:1 1 auto;overflow:auto;padding:0 12px 20px;min-height:0}
.sb-select{display:flex;align-items:center;justify-content:space-between;width:100%;background:rgba(255,255,255,.1);border:0;border-radius:8px;padding:9px 12px;font-weight:700;color:var(--text);text-align:left}
[data-theme=light] .sb-select{background:#eceef2}
.sb-select svg{width:16px;height:16px}
.cat-h{display:flex;align-items:center;gap:12px;padding:12px 0 8px;cursor:pointer;user-select:none}
.cat-h .t{font-family:var(--disp);font-weight:800;font-size:22px;font-stretch:condensed;flex:1}
.cat-h .chev{width:20px;height:20px;transition:transform .18s;color:var(--muted)}
.cat.collapsed .chev{transform:rotate(180deg)}
.cat.collapsed .cat-b{display:none}
.cat-b{padding-left:14px}
.crow{display:flex;align-items:center;gap:12px;padding:6px 0;min-height:40px}
.crow .ic{width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center}
.crow .ic svg{width:30px;height:30px;display:block}
.crow .nm{flex:1;min-width:0;font-weight:700;line-height:1.15}
.crow .nm small{display:block;font-weight:400;font-size:11.5px;color:var(--dim)}
.crow.off .nm,.crow.off .ic{opacity:.5}
.crow .cnt{font-family:var(--disp);font-weight:800;font-size:15px;color:var(--gold);min-width:20px;text-align:right}
.crow .cnt.z{color:var(--dim)}
.addb{width:28px;height:28px;border-radius:7px;border:0;background:var(--chip);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.addb:hover,.addb.on{background:var(--gold);color:var(--ink)}
.addb svg{width:15px;height:15px}
.sb-note{font-size:12.5px;color:var(--dim);background:var(--panel2);border-radius:8px;padding:9px 11px;margin:4px 0 6px}
.sb-note b{color:var(--muted)}
.searchbox{position:relative}
.sresults{margin-top:6px;border-radius:8px;overflow:hidden;display:none;background:var(--panel2)}
.sresults.on{display:block}
.sresults button{display:flex;width:100%;justify-content:space-between;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;gap:8px}
.sresults button:hover{background:var(--line)}

.map-wrap{position:relative;flex:1 1 auto;min-width:0;background:#0f4796;overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.grabbing{cursor:grabbing}
#map.crosshair{cursor:crosshair}
.map-wrap.nitemare #mapimg{filter:hue-rotate(-25deg) saturate(1.2) brightness(.8)}
#nm-overlay{display:none;pointer-events:none}
.map-wrap.nitemare #nm-overlay{display:inline}
.map-msg{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--panel);border-radius:10px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);z-index:4;display:none;align-items:center;gap:10px;font-size:13.5px;max-width:calc(100% - 140px)}
.map-msg.on{display:flex}

/* map text + markers */
.mlbl{font-family:var(--disp);font-weight:900;text-transform:uppercase;font-stretch:condensed;paint-order:stroke;stroke:#000;stroke-width:4px;stroke-linejoin:round;fill:#fff;pointer-events:none;letter-spacing:.01em}
.mlbl.poi{font-size:17px}
.mlbl.lm{font-size:11.5px;stroke-width:3px}
.mlbl.sm{font-size:11px;fill:#ffe45c;stroke-width:3px}
.mk{cursor:pointer}
.mk .hit{fill:transparent}
.cnt-b{font-family:var(--disp);font-weight:900;font-stretch:condensed}
svg[data-z="0"] .zlm{display:none}
svg[data-z="0"] .zlm2,svg[data-z="1"] .zlm2{display:none}
.focus-dim .mk:not(.inroute),.focus-dim .lblg:not(.inroute){opacity:.25}
.sel-ring{fill:none;stroke:#fff;stroke-width:2.5;stroke-dasharray:5 4;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-90}}
.pulse{animation:pulse 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.dash-move{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.scan-ring{fill:none;stroke:var(--arc);stroke-width:2.5}

/* sidebar edge tabs (like fortnite.gg) */
.edge-tabs{position:absolute;left:0;top:10px;z-index:6;display:flex;flex-direction:column;gap:6px}
.edge-tabs button{width:30px;height:32px;border:0;border-radius:0 7px 7px 0;background:var(--gold);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow)}
.edge-tabs svg{width:18px;height:18px;transition:transform .2s}
.edge-tabs .flip svg{transform:rotate(180deg)}

/* right tools */
.tools{position:absolute;right:10px;top:10px;z-index:7;display:flex;flex-direction:column;gap:8px}
.tgrp{display:flex;flex-direction:column;gap:6px}
.tbtn{width:40px;height:40px;border-radius:9px;border:0;display:grid;place-items:center;position:relative;box-shadow:var(--shadow);background:var(--panel);color:var(--muted)}
.tbtn:hover{color:var(--text)}
.tbtn.y{background:var(--gold);color:var(--ink)}
.tbtn.y.on{box-shadow:0 0 0 3px #fff,var(--shadow)}
.tbtn.on:not(.y){background:var(--gold);color:var(--ink)}
.tbtn svg{width:20px;height:20px}
.tbtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;right:48px;top:50%;transform:translateY(-50%);white-space:nowrap;background:#000;color:#fff;padding:5px 9px;border-radius:6px;font-size:13px;font-weight:700;pointer-events:none}
.zone-pop{background:var(--panel);border-radius:10px;padding:10px;width:180px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;align-self:flex-end}

/* floating tool panel */
.tpanel{position:absolute;right:60px;top:10px;width:370px;max-height:calc(100% - 20px);background:var(--panel);border-radius:12px;box-shadow:var(--shadow);z-index:8;display:none;flex-direction:column;overflow:hidden}
.tpanel.on{display:flex}
.tp-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex:0 0 auto}
.tp-h h2{flex:1;font-size:22px}
.tp-h .ic{width:30px;height:30px;border-radius:8px;background:var(--gold);color:var(--ink);display:grid;place-items:center}
.tp-h .ic svg{width:18px;height:18px}
.tp-b{padding:14px;overflow:auto;flex:1 1 auto;min-height:0}
.iconx{width:30px;height:30px;border-radius:8px;border:0;background:var(--chip);display:grid;place-items:center;color:var(--muted)}
.iconx svg{width:16px;height:16px}

.hud{position:absolute;left:40px;bottom:10px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;pointer-events:none}
.hud .chip{background:rgba(0,0,0,.72);color:#fff;border-radius:7px;padding:4px 9px;font:700 12px var(--mono)}
.scalebar{display:flex;align-items:center;gap:6px}
.scalebar i{display:block;height:5px;border:2px solid #fff;border-top:0}
.zoomctl{position:absolute;right:10px;bottom:10px;z-index:6;display:flex;flex-direction:column;gap:6px}
.modebar{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:9;display:none;align-items:center;gap:10px;background:var(--gold);color:var(--ink);border-radius:10px;padding:6px 6px 6px 14px;box-shadow:var(--shadow);font-weight:800;max-width:calc(100% - 140px)}
.modebar.on{display:flex}
.modebar .btn{background:#000;color:#fff}
.scrim{display:none}

/* panel internals */
.sec{margin-bottom:16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.statgrid .kpi .v{font-size:22px}
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--gold);padding:2px 0 2px 10px;margin:10px 0}
.boss{display:flex;gap:10px;align-items:center;padding:10px;background:color-mix(in srgb,var(--danger) 12%,var(--panel2));border-radius:10px;margin:8px 0}
.boss svg{width:20px;height:20px;flex:0 0 auto}
.vault{background:color-mix(in srgb,var(--gold) 12%,var(--panel2))}
.wp{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;background:var(--panel2);margin-bottom:6px;border:0;color:var(--text)}
.wp .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--ink);font-family:var(--disp);font-weight:900;font-size:14px;flex:0 0 auto}
.wp .wn{flex:1;min-width:0;line-height:1.2}
.wp .wn b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .wn span{font-size:12px;color:var(--dim)}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:7px;border:0;background:var(--chip);color:var(--muted);flex:0 0 auto}
.icon-btn:hover{color:var(--text)}
.icon-btn svg{width:14px;height:14px}
.console{font:12px/1.55 var(--mono);background:#0b0c0e;color:#9fe3d6;border-radius:9px;padding:10px;height:150px;overflow:auto;white-space:pre-wrap}
.console .g{color:#ffe45c}.console .d{color:#6d7f8f}.console .r{color:#ff8b80}
.timer{font:900 52px/1 var(--disp);font-stretch:condensed;text-align:center;font-variant-numeric:tabular-nums;padding:12px 0 4px}
.timer.jump{color:var(--ok);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.seg{display:flex;background:var(--chip);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;border-radius:7px;padding:6px 8px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--gold);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:0;background:var(--chip);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;color:var(--muted)}
.chipb.on{background:var(--gold);color:var(--ink)}
.empty{padding:16px;text-align:center;color:var(--dim);font-size:13.5px;background:var(--panel2);border-radius:10px}
.notice{background:color-mix(in srgb,var(--warn) 12%,var(--panel2));padding:10px 12px;border-radius:10px;font-size:13.5px;color:var(--muted)}
.notice b{color:var(--text)}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.hero-main{position:relative;overflow:hidden;min-height:250px;background:#000 center/cover no-repeat;padding:22px;display:flex;flex-direction:column;justify-content:flex-end}
.hero-main::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.85))}
.hero-main>*{position:relative}
.hero-main p{color:#ddd;max-width:54ch;margin:8px 0 14px}
.count{display:flex;gap:8px;margin-top:10px}
.count div{flex:1;text-align:center;background:var(--panel2);border-radius:9px;padding:8px 4px}
.count b{display:block;font:900 30px/1 var(--disp);font-stretch:condensed;font-variant-numeric:tabular-nums}
.count span{font-size:10.5px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;font-weight:700}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:0;border-radius:12px;padding:16px;color:var(--text);transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-2px);box-shadow:0 0 0 2px var(--gold)}
.tile .ic{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:var(--gold);color:var(--ink)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-family:var(--disp);font-weight:800;font-size:20px;text-transform:uppercase;font-stretch:condensed}
.tile span{font-size:13px;color:var(--muted)}
.sect-t{display:flex;align-items:center;gap:10px;margin:24px 0 12px}
.sect-t h2{font-size:24px}
.sect-t::after{content:"";flex:1;height:2px;background:var(--line)}

/* slots */
.slot{display:flex;flex-direction:column;gap:10px}
.slot .pv{aspect-ratio:1/1;border-radius:10px;background:var(--bg2);overflow:hidden;position:relative}
.slot .pv svg{width:100%;height:100%;display:block}
.slot .pv .badge{position:absolute;top:8px;left:8px}
.slot.emptyslot .pv{display:grid;place-items:center;color:var(--dim);background:repeating-linear-gradient(45deg,var(--panel2) 0 10px,var(--panel) 10px 20px)}

/* settings */
.themes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.theme-card{border:0;border-radius:10px;padding:10px;background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:8px;color:var(--text)}
.theme-card.on{box-shadow:0 0 0 2px var(--gold)}
.theme-card .sw4{display:flex;height:26px;border-radius:6px;overflow:hidden}
.theme-card .sw4 i{flex:1}
.theme-card b{font-size:14px}
.datatable{max-height:420px;overflow:auto;border-radius:10px;background:var(--panel2)}
.datatable input{width:70px;padding:4px 6px;border-radius:6px;border:0;background:rgba(255,255,255,.1)}
.datatable thead th{position:sticky;top:0;background:var(--panel2)}
.log-entry{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.log-entry:last-child{border-bottom:0}
.log-entry ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.log-entry li{margin:3px 0}
.ver{font:900 22px var(--disp);color:var(--gold)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border-radius:14px;max-width:440px;width:100%;box-shadow:var(--shadow);padding:20px;max-height:90vh;overflow:auto}
.modal p{color:var(--muted);margin:6px 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#000;color:#fff;padding:9px 14px;border-radius:9px;box-shadow:var(--shadow);font-size:14px;font-weight:700;border-left:4px solid var(--gold);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.themes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button span{display:none}.nav svg{display:block}.nav button{padding:0 9px}
  .filters-btn{display:inline-flex}
  #sidebar{position:absolute;left:0;top:0;bottom:0;width:min(340px,88vw);margin-left:0!important;transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--shadow);z-index:30}
  #sidebar.mopen{transform:none}
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:25}
  .scrim.on{display:block}
  .edge-tabs{display:none}
  .tpanel{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:60%}
  .hud{left:10px;bottom:10px}
  .zoomctl{display:none}
  .log-entry{grid-template-columns:1fr;gap:4px}
  .modebar{top:auto;bottom:12px;max-width:calc(100% - 20px)}
}
@media (max-width:560px){
  .topbar{padding:0 8px;gap:6px}
  .brand-name{font-size:18px}
  .g2,.g3{grid-template-columns:1fr}
  .themes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .page{padding:16px 12px 32px}
  h1{font-size:28px}
  .tbtn{width:36px;height:36px}
  .hud .chip.hide-sm{display:none}
  .mlbl.poi{font-size:14px}
  .tools .tgrp.more{display:none}
  .tools.expanded .tgrp.more{display:flex}
  .tbtn.morebtn{display:grid}
}
.tbtn.morebtn{display:none}
@media (max-height:760px){.tools .tgrp.more{display:none}.tools.expanded .tgrp.more{display:flex}.tbtn.morebtn{display:grid}.tools{max-height:calc(100% - 20px);overflow:auto;padding:2px}}
@media (max-width:420px){.brand-name{display:none}.filters-btn span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
'use strict';
/* =====================================================================
   Fortnite Dynamic Map v2 — vanilla JS, single file.
   Map image + location coordinates: fortnite-api.com /v1/map (public API),
   fetched live and cached; bundled fallback below.
   World→map: px2048 = world * K + C  (calibrated against the official
   labelled render). Internal map space is 0..1000 on both axes.
   ===================================================================== */
const APP_VERSION = '2.1.0';
const LS = 'fdm.v2.';
const API_URL = 'https://fortnite-api.com/v1/map';
const DEFAULT_IMG = 'https://fortnite-api.com/images/map.png';
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) { toast('Storage full or blocked — not saved'); } },
  del(k) { try { localStorage.removeItem(LS + k); } catch (e) {} }
};

/* ---------------- utils ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const uid = () => Math.random().toString(36).slice(2, 9);
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmtS = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s / 60); return m ? `${m}:${String(s % 60).padStart(2, '0')}` : `${s}s`; };
const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1);
const MPU = () => (2048 / S.calK) / 100 / 1000; // metres per map unit (world units are cm)
const fmtM = u => { const m = u * MPU(); return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m'; };
const gridRef = (x, y) => 'ABCDEFGHIJ'[clamp(Math.floor(x / 100), 0, 9)] + (clamp(Math.floor(y / 100), 0, 9) + 1);

/* ---------------- icons ---------------- */
const IC = {
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  drop: '<path d="M4 10a8 6 0 0 1 16 0z"/><path d="M4 10l8 9 8-9M12 10v9"/>',
  oracle: '<circle cx="12" cy="12" r="9"/><path d="M12 12l6-4"/><circle cx="12" cy="12" r="4.5"/>',
  route: '<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  heat: '<path d="M12 3c2 4 6 5.5 6 10a6 6 0 0 1-12 0c0-2.5 1.5-4 3-5 0 2 1 3 2 3 0-3-1-5 1-8z"/>',
  chest: '<rect x="3" y="9" width="18" height="11" rx="1.5"/><path d="M3 9a9 4 0 0 1 18 0"/><path d="M10 13h4v3h-4z"/>',
  grid: '<path d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18"/>',
  label: '<path d="M4 7V5h16v2M9 19h6M12 5v14"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  focus: '<path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4"/><circle cx="12" cy="12" r="3"/>',
  ruler: '<path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/>',
  zone: '<circle cx="12" cy="12" r="9" stroke-dasharray="3 2.5"/><circle cx="12" cy="12" r="2.5"/>',
  fit: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  full: '<path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/>',
  bus: '<rect x="4" y="4" width="16" height="13" rx="2"/><path d="M4 11h16M8 21v-4M16 21v-4"/>',
  up: '<path d="M6 15l6-6 6 6"/>', down: '<path d="M6 9l6 6 6-6"/>', x: '<path d="M6 6l12 12M18 6L6 18"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  save: '<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/>',
  wand: '<path d="M4 20L16 8"/><path d="M15 3v3M18 6h3M19.5 3.5l-2 2M12 5h2M19 10v2"/>',
  target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/>',
  play: '<path d="M7 4l13 8-13 8z"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="1"/>',
  dice: '<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  move: '<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
  crown: '<path d="M3 8l4 4 5-7 5 7 4-4-2 11H5z"/>',
  key: '<circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M17 5l2 2M15 7l2 2"/>',
  map: '<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/>',
  dl: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', ul: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  refresh: '<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2M20 4v5h-5M4 20v-5h5"/>',
  chev: '<path d="M6 15l6-6 6 6"/>', sel: '<path d="M6 9l6 6 6-6"/>',
};
const ico = (n, sw = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${IC[n] || ''}</svg>`;

/* marker glyphs (24 box, white strokes) */
const GLYPH = {
  pumpkin: '<path d="M12 7c-5 0-8 3-8 7s3 6 8 6 8-2 8-6-3-7-8-7z"/><path d="M12 7V4M9.5 7.5c-1 3-1 9 0 12M14.5 7.5c1 3 1 9 0 12"/>',

function saveRoute() { store.set('route', ROUTE); }
function routeStats(pts, travel = 'foot') {
  const M = MPU(), sp = travel === 'vehicle' ? S.vehSpeed : S.footSpeed;

  pts.forEach((p, i) => { if (i) d += dist(pts[i - 1], p); const n = p.id && byId(p.id); if (n) { dwell += nodeDwell(n, oracleOpts); chests += n.chests || 0; if (n.boss) bosses++; } else { const s = p.id && spawnById(p.id); if (s) { dwell += S.secPerChest; if (['chest', 'rarechest', 'pumpkin'].includes(s.type)) chests++; } } });
  const run = d * M * 1.12 / sp; return { d, run, dwell, total: run + dwell, chests, bosses };
}
function optimiseRoute() {
  if (ROUTE.length < 4) { toast('Need at least 4 points to optimise'); return; }
  let ord = ROUTE.slice(); const L = r => r.reduce((s, p, i) => s + (i ? dist(r[i - 1], p) : 0), 0); let best = L(ord), imp = true;
  while (imp) { imp = false; for (let i = 1; i < ord.length - 1; i++) for (let j = i + 1; j < ord.length; j++) { const c = ord.slice(0, i).concat(ord.slice(i, j + 1).reverse(), ord.slice(j + 1)), l = L(c); if (l < best - .01) { ord = c; best = l; imp = true; } } }
  const saved = L(ROUTE) - best; ROUTE = ord; saveRoute(); renderRoute(); renderTool();
  toast(saved > 1 ? `Order optimised — saved ${fmtM(saved)}` : 'Already optimal');
}
const encodeRoute = r => btoa(unescape(encodeURIComponent(JSON.stringify({ v: 2, n: r.name, p: r.pts.map(p => [Math.round(p.x * 10) / 10, Math.round(p.y * 10) / 10, p.id && byId(p.id) ? p.id : 0, p.id && byId(p.id) ? 0 : (p.label || '')]) })))).replace(/=+$/, '');
function decodeRoute(code) {

  return { name: String(o.n || 'Shared route').slice(0, 40), pts: o.p.map(a => ({ x: clamp(+a[0], 0, 1000), y: clamp(+a[1], 0, 1000), id: a[2] || null, label: a[2] && byId(a[2]) ? byId(a[2]).name : (a[3] || 'Waypoint') })), t: Date.now(), source: 'import' };
}

async function refreshApi(manual) {
  try {
    const r = await fetch(API_URL, { cache: 'no-store' }), j = await r.json();
    if (j.status !== 200 || !j.data || !Array.isArray(j.data.pois)) throw new Error('bad');
    const pois = j.data.pois.filter(p => p.location).map(p => [p.id, p.name, p.location.x, p.location.y]);
    API = { t: Date.now(), img: (j.data.images && j.data.images.blank) || DEFAULT_IMG, pois };
    store.set('api', API); buildNodes(); setMapImage(); renderAll(); renderSidebar();
    if (curView === 'settings') renderSettings();
    if (manual) toast(`Map data refreshed — ${pois.length} locations`);
  } catch (e) { if (manual) toast("Couldn't reach fortnite-api.com"); }
}
const idb = {
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('fdm', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch (e) { return false; } },
  async del(k) { try { const db = await this.open(); db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) {} }
};

  if ((e.key === 'z' && (e.ctrlKey || e.metaKey)) && ROUTE.length && (mode === 'build' || curTool === 'builder')) { e.preventDefault(); ROUTE.pop(); saveRoute(); renderRoute(); renderTool(); }

$$('.nav [data-go], .brand').forEach(b => b.onclick = () => go(b.dataset.go));
$('#filtersbtn').onclick = toggleSidebar;
$('#sbtoggle').onclick = toggleSidebar;
$('#scrim').onclick = closeMobileSidebar;
$('#modecancel').onclick = () => setMode('select');

setTheme(S.theme);
buildNodes();
initSVG();
setMapImage();
initPointer();
loadCustom();
if (store.get('sbClosed', false) && innerWidth > 860) { $('#sidebar').classList.add('closed'); $('#sbtoggle').parentElement.classList.add('flip'); }
const hashRoute = (() => { const m = location.hash.match(/#r=([A-Za-z0-9+/=_-]+)/); if (!m) return null; try { return decodeRoute(m[1]); } catch (e) { return null; } })();
if (hashRoute) { go('map'); loadRoutePts(hashRoute.pts, hashRoute.name); history.replaceState(null, '', location.pathname + location.search); }
else go(store.get('view', 'map'));
if (!API.t || Date.now() - API.t > 6 * 3600e3) refreshApi(false);

</script>
