<!doctype html>
<html lang="en" data-theme="boardroom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1218">
<meta name="description" content="Fortnite Dynamic Map — interactive Chapter 7 Season 4 map with layers, drop calculator, loot-route AI and saved route slots.">
<title>Fortnite Dynamic Map</title>
<style>
:root{
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --serif:'Cinzel','Trajan Pro','Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;--r2:6px;
}
[data-theme=boardroom]{--bg:#0c1117;--bg2:#10171f;--panel:#141c26;--panel2:#19232f;--line:#232f3e;--line2:#2f3e52;--text:#e6ebf1;--muted:#8e9bac;--dim:#617084;--gold:#d3ad58;--gold2:#f1d68e;--arc:#53b8c6;--danger:#e5655b;--ok:#5cc48b;--warn:#e7a948;--shadow:0 12px 32px rgba(0,0,0,.38);--water:#163a56;--chip:#1d2836}
[data-theme=parchment]{--bg:#efe9dc;--bg2:#e7dfcd;--panel:#fbf8f1;--panel2:#f3eee2;--line:#dcd2bd;--line2:#cbbd9f;--text:#1f242b;--muted:#665f52;--dim:#8f8674;--gold:#946519;--gold2:#b8862f;--arc:#2c6d78;--danger:#b8433a;--ok:#2f8a57;--warn:#b07418;--shadow:0 10px 26px rgba(70,55,25,.16);--water:#2a5e7c;--chip:#ece4d2}
[data-theme=arcane]{--bg:#0f0c1a;--bg2:#141024;--panel:#19142c;--panel2:#201a38;--line:#2c2548;--line2:#3b3260;--text:#ece8f8;--muted:#a097c0;--dim:#6f6795;--gold:#c9a8ff;--gold2:#e6d6ff;--arc:#5fd6c6;--danger:#ff6b7f;--ok:#5fd69a;--warn:#f1b65a;--shadow:0 12px 34px rgba(0,0,0,.45);--water:#1c2a52;--chip:#231d3d}
[data-theme=nitemare]{--bg:#120c09;--bg2:#181009;--panel:#1d140f;--panel2:#251a13;--line:#36261b;--line2:#4a3424;--text:#f5ebe2;--muted:#b49d8a;--dim:#7d6a5b;--gold:#ff8f2e;--gold2:#ffc27a;--arc:#a771ff;--danger:#ff5a4f;--ok:#7bd36b;--warn:#ffb347;--shadow:0 12px 34px rgba(0,0,0,.5);--water:#221836;--chip:#2a1d15}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--arc)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:58px;background:linear-gradient(180deg,var(--panel),var(--bg2));border-bottom:1px solid var(--line);position:relative;z-index:30}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 30%,var(--gold2) 50%,var(--gold) 70%,transparent);opacity:.55}
.brand{display:flex;align-items:center;gap:10px;min-width:0;cursor:pointer;background:none;border:0;padding:0}
.brand svg{flex:0 0 auto}
.brand-txt{display:flex;flex-direction:column;line-height:1.1;min-width:0;text-align:left}
.brand-name{font-family:var(--serif);font-weight:700;letter-spacing:.08em;font-size:15px;text-transform:uppercase;white-space:nowrap;color:var(--text)}
.brand-sub{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.nav{display:flex;gap:2px;margin-left:auto;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:3px}
.nav button{background:none;border:0;padding:7px 12px;border-radius:6px;color:var(--muted);font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.nav button:hover{color:var(--text)}
.nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.nav button.on svg{color:var(--gold)}
.nav svg{width:16px;height:16px}

/* ---------- views ---------- */
#views{flex:1 1 auto;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block}
#v-map.on{display:flex;overflow:hidden}
.page{max-width:1180px;margin:0 auto;padding:22px 18px 40px}

/* ---------- typography / common ---------- */
h1,h2,h3{font-family:var(--serif);letter-spacing:.06em;margin:0;font-weight:700}
h1{font-size:28px}
h2{font-size:17px;text-transform:uppercase}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--gold)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.rule{display:flex;align-items:center;gap:10px;margin:22px 0 14px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line2))}
.rule::after{background:linear-gradient(90deg,var(--line2),transparent)}
.rule span{font-family:var(--serif);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:8px}
.rule span::before,.rule span::after{content:"◆";font-size:7px;opacity:.7}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:relative}
.card.crest::before,.card.crest::after{content:"";position:absolute;width:12px;height:12px;border:1.5px solid var(--gold);opacity:.6;pointer-events:none}
.card.crest::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-top-left-radius:var(--r)}
.card.crest::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-bottom-right-radius:var(--r)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);font-weight:600;font-size:13px;color:var(--text);transition:border-color .15s,background .15s;white-space:nowrap;min-height:36px}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1408;border-color:var(--gold)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line2))}
.btn.sm{padding:5px 9px;font-size:12px;min-height:30px}
.btn.on{border-color:var(--gold);color:var(--gold2);background:color-mix(in srgb,var(--gold) 12%,var(--panel2))}
.btn svg{width:15px;height:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stack>*+*{margin-top:10px}

.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.inp,select.inp{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line2);background:var(--bg2);min-height:36px}
.inp:focus{outline:none;border-color:var(--gold)}
input[type=range]{width:100%;accent-color:var(--gold)}

.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--dim)}
.kpi.gold .v{color:var(--gold2)}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--chip);border:1px solid var(--line2);color:var(--muted)}
.tag.gold{color:var(--gold2);border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.tag.red{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.tag.arc{color:var(--arc);border-color:color-mix(in srgb,var(--arc) 45%,transparent)}
.tag.est{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--line2)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--panel2)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:50px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.red i{background:linear-gradient(90deg,var(--warn),var(--danger))}

/* switch */
.sw{position:relative;display:inline-block;width:36px;height:20px;flex:0 0 auto}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--line2);transition:.18s}
.sw i::after{content:"";position:absolute;width:14px;height:14px;left:3px;top:3px;border-radius:50%;background:var(--muted);transition:.18s}
.sw input:checked+i{background:color-mix(in srgb,var(--gold) 55%,var(--line2))}
.sw input:checked+i::after{transform:translateX(16px);background:var(--gold2)}
.sw input:focus-visible+i{outline:2px solid var(--arc);outline-offset:2px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:stretch}
.hero-main{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--gold) 14%,transparent),transparent 55%),radial-gradient(90% 120% at 100% 100%,color-mix(in srgb,var(--arc) 12%,transparent),transparent 60%),var(--panel);padding:24px}
.hero-main p{color:var(--muted);max-width:56ch;margin:10px 0 18px}
.count{display:flex;gap:8px;margin-top:8px}
.count div{flex:1;text-align:center;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.count b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.count span{font-size:10px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s,transform .15s;color:var(--text)}
.tile:hover{border-color:var(--gold);transform:translateY(-1px)}
.tile .ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--gold) 14%,var(--panel2));color:var(--gold2);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent)}
.tile .ic svg{width:19px;height:19px}
.tile b{font-size:14px}
.tile span{font-size:12.5px;color:var(--muted)}
.notice{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,var(--panel));padding:10px 14px;border-radius:0 8px 8px 0;font-size:13px;color:var(--muted)}
.notice b{color:var(--text)}

/* ---------- map view ---------- */
.map-wrap{position:relative;flex:1 1 auto;min-width:0;background:var(--water);overflow:hidden;touch-action:none}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
#map.grabbing{cursor:grabbing}
#map.crosshair{cursor:crosshair}
.map-wrap.nitemare #terrain{filter:hue-rotate(-28deg) saturate(1.25) brightness(.78) contrast(1.05)}
#nm-overlay{display:none;pointer-events:none}
.map-wrap.nitemare #nm-overlay{display:inline}
.map-loading{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:var(--gold2);font-family:var(--serif);letter-spacing:.2em;text-transform:uppercase;font-size:12px}
.map-loading.gone{display:none}

.mk{cursor:pointer}
.mk .hit{fill:transparent}
.mlbl{font-family:var(--font);font-weight:800;letter-spacing:.06em;text-transform:uppercase;paint-order:stroke;stroke:rgba(8,12,18,.85);stroke-width:3.2px;stroke-linejoin:round;fill:#fff;pointer-events:none}
.mlbl.poi{font-size:12.5px}
.mlbl.lm{font-size:9.5px;font-weight:700;fill:#e9eef4;letter-spacing:.04em}
.mlbl.sm{font-size:9px;fill:#ffe6a6}
svg[data-z="0"] .zlm{display:none}
svg[data-z="0"] .zlm2,svg[data-z="1"] .zlm2{display:none}
.focus-dim .mk:not(.inroute),.focus-dim .lblg:not(.inroute){opacity:.28}
.sel-ring{fill:none;stroke:#fff;stroke-width:2;stroke-dasharray:4 3;animation:spin 6s linear infinite}
@keyframes spin{to{stroke-dashoffset:-70}}
.pulse{animation:pulse 1.6s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.dash-move{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}
.scan-ring{fill:none;stroke:var(--arc);stroke-width:2;opacity:.9}

.enh{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.enh-grp{display:flex;flex-direction:column;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line2);border-radius:9px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
.enh button{width:38px;height:36px;display:grid;place-items:center;background:none;border:0;border-bottom:1px solid var(--line);color:var(--muted);position:relative}
.enh button:last-child{border-bottom:0}
.enh button:hover{color:var(--text);background:var(--panel2)}
.enh button.on{color:var(--gold2);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.enh button.on::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--gold);border-radius:2px}
.enh svg{width:17px;height:17px}
.enh button[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:44px;top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--panel);border:1px solid var(--line2);padding:4px 8px;border-radius:6px;font-size:12px;color:var(--text);pointer-events:none;z-index:10}

.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;pointer-events:none}
.hud .chip{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line2);border-radius:7px;padding:4px 9px;font:600 11.5px var(--mono);color:var(--muted);backdrop-filter:blur(6px)}
.hud .chip b{color:var(--text)}
.scalebar{display:flex;align-items:center;gap:6px}
.scalebar i{display:block;height:5px;border:1.5px solid var(--text);border-top:0}
.modebar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--gold);border-radius:9px;padding:6px 6px 6px 12px;box-shadow:var(--shadow);font-size:13px;font-weight:600;max-width:calc(100% - 120px)}
.modebar.on{display:flex}
.modebar .dotp{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 25%,transparent);flex:0 0 auto}
.zoomctl{position:absolute;right:12px;bottom:12px;z-index:5}
.mobile-panel-toggle{display:none}

/* side panel */
.panel{flex:0 0 380px;display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-height:0;z-index:8}
.ptabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:0 0 auto;background:var(--bg2)}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{flex:1 0 auto;background:none;border:0;padding:11px 10px 10px;color:var(--muted);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;justify-content:center}
.ptabs button svg{width:14px;height:14px}
.ptabs button.on{color:var(--text);border-bottom-color:var(--gold)}
.ptabs button.on svg{color:var(--gold)}
.pbody{flex:1 1 auto;overflow:auto;padding:14px;min-height:0}
.pane{display:none}
.pane.on{display:block}
.sec{margin-bottom:16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.lrow{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .sw{margin-left:auto}
.lrow .lic{width:22px;height:22px;flex:0 0 auto;display:grid;place-items:center}
.lrow .lt{display:flex;flex-direction:column;line-height:1.2}
.lrow .lt b{font-size:13px}
.lrow .lt span{font-size:11.5px;color:var(--dim)}
.searchbox{position:relative}
.searchbox .inp{padding-left:32px}
.searchbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--dim)}
.sresults{margin-top:6px;border:1px solid var(--line2);border-radius:8px;overflow:hidden;display:none}
.sresults.on{display:block}
.sresults button{display:flex;width:100%;justify-content:space-between;background:var(--panel2);border:0;border-bottom:1px solid var(--line);padding:8px 10px;text-align:left}
.sresults button:hover{background:var(--line)}

.info-head{display:flex;gap:12px;align-items:flex-start}
.info-ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line2);background:var(--panel2)}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.statgrid .kpi .v{font-size:17px}
.note{font-size:13px;color:var(--muted);border-left:2px solid var(--gold);padding:2px 0 2px 10px;margin:10px 0}
.boss{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid color-mix(in srgb,var(--danger) 35%,var(--line));background:color-mix(in srgb,var(--danger) 7%,var(--panel2));border-radius:8px;margin:8px 0}
.vault{border-color:color-mix(in srgb,var(--gold) 40%,var(--line));background:color-mix(in srgb,var(--gold) 7%,var(--panel2))}

.wp{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:6px}
.wp .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#1a1408;font-weight:800;font-size:11px;flex:0 0 auto}
.wp .wn{flex:1;min-width:0;line-height:1.2}
.wp .wn b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wp .wn span{font-size:11px;color:var(--dim)}
.icon-btn{width:28px;height:28px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);flex:0 0 auto}
.icon-btn:hover{color:var(--text);border-color:var(--gold)}
.icon-btn svg{width:14px;height:14px}

.console{font:12px/1.55 var(--mono);background:#06090d;color:#9fe3d6;border:1px solid var(--line2);border-radius:8px;padding:10px;height:150px;overflow:auto;white-space:pre-wrap}
[data-theme=parchment] .console{background:#1b2027}
.console .g{color:#f1d68e}.console .d{color:#6d7f8f}.console .r{color:#ff8b80}
.timer{font:800 46px/1 var(--mono);text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;padding:14px 0 6px}
.timer.jump{color:var(--ok);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{flex:1;background:var(--bg2);border:0;border-right:1px solid var(--line2);padding:7px 8px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on{background:color-mix(in srgb,var(--gold) 16%,var(--panel2));color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1px solid var(--line2);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.chipb.on{color:var(--text);border-color:var(--gold)}
.chipb i{width:9px;height:9px;border-radius:50%;display:block}
.empty{padding:18px;text-align:center;color:var(--dim);font-size:13px;border:1px dashed var(--line2);border-radius:8px}

/* slots */
.slot{display:flex;flex-direction:column;gap:10px}
.slot .pv{aspect-ratio:1/1;border-radius:8px;background:var(--water);overflow:hidden;border:1px solid var(--line2);position:relative}
.slot .pv svg{width:100%;height:100%;display:block}
.slot .pv .badge{position:absolute;top:8px;left:8px}
.slot.emptyslot .pv{display:grid;place-items:center;color:var(--dim);background:repeating-linear-gradient(45deg,var(--panel2) 0 10px,var(--panel) 10px 20px)}

/* settings */
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.theme-card{border:1px solid var(--line2);border-radius:10px;padding:10px;background:var(--panel2);text-align:left;display:flex;flex-direction:column;gap:8px}
.theme-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.theme-card .sw4{display:flex;height:26px;border-radius:6px;overflow:hidden}
.theme-card .sw4 i{flex:1}
.theme-card b{font-size:13px}
.datatable{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.datatable input{width:70px;padding:4px 6px;border-radius:5px;border:1px solid var(--line2);background:var(--bg2)}
.datatable thead th{position:sticky;top:0;background:var(--panel)}

/* changelog */
.log-entry{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.log-entry ul{margin:6px 0 0;padding-left:18px;color:var(--muted)}
.log-entry li{margin:3px 0}
.ver{font-family:var(--mono);font-weight:700;color:var(--gold2)}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,12,.62);display:none;align-items:center;justify-content:center;z-index:100;padding:16px;backdrop-filter:blur(3px)}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:440px;width:100%;box-shadow:var(--shadow);padding:20px;max-height:90vh;overflow:auto}
.modal h2{margin-bottom:8px}
.modal p{color:var(--muted);margin:6px 0 14px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toasts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:3px solid var(--gold);padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);font-size:13px;font-weight:600;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- responsive ---------- */
@media (max-width:1100px){.panel{flex-basis:340px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .themes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nav button span{display:none}
  .nav button{padding:8px 10px}
  #v-map.on{flex-direction:column}
  .panel{flex:0 0 auto;height:46%;border-left:0;border-top:1px solid var(--line);transition:height .22s ease}
  .panel.collapsed{height:44px}
  .panel.collapsed .pbody{display:none}
  .mobile-panel-toggle{display:grid;place-items:center;width:44px;flex:0 0 auto;background:var(--bg2);border:0;border-left:1px solid var(--line);color:var(--muted)}
  .mobile-panel-toggle svg{width:16px;height:16px;transition:transform .2s}
  .panel.collapsed .mobile-panel-toggle svg{transform:rotate(180deg)}
  .modebar{top:auto;bottom:52px;max-width:calc(100% - 24px)}
  .log-entry{grid-template-columns:1fr;gap:4px}
}
@media (max-width:560px){
  .topbar{padding:0 10px;gap:8px;height:54px}
  .brand-sub{display:none}
  .brand-name{font-size:13px}
  .g2,.g3{grid-template-columns:1fr}
  .page{padding:16px 12px 32px}
  h1{font-size:22px}
  .statgrid{grid-template-columns:repeat(3,1fr)}
  .enh button{width:34px;height:32px}
  .hud .chip.hide-sm{display:none}
  .mlbl.poi{font-size:10px}
  .mlbl.lm{font-size:8.5px}
}
@media (max-width:440px){.brand-txt{display:none}.nav{margin-left:auto}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* =====================================================================
   NOISE + ISLAND GEOMETRY
   ===================================================================== */
const PERM = (() => { const r = mulberry32(7331), p = new Uint8Array(512), a = [...Array(256).keys()]; for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } for (let i = 0; i < 512; i++) p[i] = a[i & 255]; return p; })();
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const h = (i, j) => PERM[(PERM[(i & 255)] + (j & 255)) & 511] / 255;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = h(xi, yi), b = h(xi + 1, yi), c = h(xi, yi + 1), d = h(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) { let s = 0, a = .5, f = 1; for (let i = 0; i < o; i++) { s += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return s; }
const coastR = t => 408 + 22 * Math.sin(3 * t + 1.3) + 15 * Math.sin(5 * t + .4) + 8 * Math.sin(8 * t + 2.2) + 5 * Math.sin(13 * t + .9);
function landAt(x, y) {
  const dx = x - 500, dy = y - 500, d = Math.hypot(dx, dy), t = Math.atan2(dy, dx);
  let m = coastR(t) + (fbm(x * .018, y * .018, 3) - .5) * 40 - d;
  for (const n of NODES) if (n.type === 'isle') m = Math.max(m, 22 + (vnoise(x * .08, y * .08) - .5) * 10 - Math.hypot(x - n.x, y - n.y));
  return m;
}

/* -- terrain raster: generated once, served as blob URL -- */
function genTerrain() {
  return new Promise(resolve => {
    const R = 1100, c = document.createElement('canvas'); c.width = c.height = R;
    const ctx = c.getContext('2d'), img = ctx.createImageData(R, R), d = img.data;
    const sites = NODES.filter(n => n.biome && n.type !== 'console').map(n => ({ x: n.x, y: n.y, w: n.type === 'poi' ? 1 : .62, c: BIOME[n.biome] }));
    const grass = [98, 140, 74];
    const sc = 1000 / R;
    for (let py = 0; py < R; py++) {
      const y = py * sc;
      for (let px = 0; px < R; px++) {
        const x = px * sc, i = (py * R + px) * 4;
        const m = landAt(x, y);
        let r, g, b;
        if (m < 0) {
          const s = clamp(-m / 55, 0, 1), rip = vnoise(x * .06, y * .06) * .08;
          r = 52 + (20 - 52) * s; g = 134 + (56 - 134) * s; b = 170 + (92 - 170) * s;
          r *= 1 + rip; g *= 1 + rip; b *= 1 + rip;
          if (m > -3.2) { const f = 1 - (-m / 3.2); r += (235 - r) * f * .7; g += (245 - g) * f * .7; b += (250 - b) * f * .7; }
        } else {
          const jit = (fbm(x * .03, y * .03, 2) - .5) * 70;
          let best = 1e9, bc = grass;
          for (const s of sites) { const dd = Math.hypot(x - s.x, y - s.y) / s.w + jit; if (dd < best) { best = dd; bc = s.c; } }
          const t = clamp((best - 55) / 85, 0, 1);
          r = bc[0] + (grass[0] - bc[0]) * t; g = bc[1] + (grass[1] - bc[1]) * t; b = bc[2] + (grass[2] - bc[2]) * t;
          const e = fbm(x * .011, y * .011, 4), e2 = fbm((x + 2) * .011, (y + 2) * .011, 4);
          const shade = clamp(1 + (e - e2) * 9 + (e - .5) * .35, .62, 1.3);
          r *= shade; g *= shade; b *= shade;
          const grain = (vnoise(x * .45, y * .45) - .5) * 14; r += grain; g += grain; b += grain;
          if (m < 9) { const f = 1 - m / 9; r += (222 - r) * f; g += (204 - g) * f; b += (150 - b) * f; }
        }
        d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    c.toBlob(bl => { if (terrainURL) URL.revokeObjectURL(terrainURL); terrainURL = URL.createObjectURL(bl); resolve(terrainURL); }, 'image/jpeg', .9);
  });
}
async function renderTerrain(force) {
  if (terrainURL && !force) { G.terrainImg.setAttribute('href', terrainURL); $('#maploading').classList.add('gone'); return; }
  $('#maploading').classList.remove('gone');

  const url = await genTerrain();

  $('#maploading').classList.add('gone');
}

/* -- roads: MST over land nodes + a few loops -- */
function renderRoads() {
  G.roads.innerHTML = '';
  if (!LAYERS.roads) return;
  const pts = NODES.filter(n => n.type === 'poi' || (n.type === 'lm' && n.ppg > 1));
  const inT = new Set([0]), edges = [];
  while (inT.size < pts.length) {
    let best = null;
    for (const i of inT) for (let j = 0; j < pts.length; j++) if (!inT.has(j)) { const dd = dist(pts[i], pts[j]); if (!best || dd < best[2]) best = [i, j, dd]; }
    inT.add(best[1]); edges.push(best);
  }
  // add short extra links for loops
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const dd = dist(pts[i], pts[j]);
    if (dd < 175 && !edges.some(e => (e[0] === i && e[1] === j) || (e[0] === j && e[1] === i)) && pts[i].type === 'poi' && pts[j].type === 'poi') edges.push([i, j, dd]);
  }
  const rnd = mulberry32(42);
  let dpath = '';
  for (const [i, j] of edges) {
    const a = pts[i], b = pts[j], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, L = dist(a, b);
    const off = (rnd() - .5) * L * .35, nx = -(b.y - a.y) / L, ny = (b.x - a.x) / L;
    dpath += `M${a.x} ${a.y}Q${mx + nx * off} ${my + ny * off} ${b.x} ${b.y}`;
  }
  el('path', { d: dpath, fill: 'none', stroke: 'rgba(40,34,24,.45)', 'stroke-width': 5, 'stroke-linecap': 'round' }, G.roads);
  el('path', { d: dpath, fill: 'none', stroke: '#e4d9b8', 'stroke-width': 2.6, 'stroke-linecap': 'round', opacity: .8 }, G.roads);
}

/* -- background (official map image) via IndexedDB -- */
const idb = {
  open() { return new Promise((res, rej) => { try { const r = indexedDB.open('fdm', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); },
  async get(k) { try { const db = await this.open(); return await new Promise(res => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await this.open(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); return true; } catch (e) { return false; } },
  async del(k) { try { const db = await this.open(); db.transaction('kv', 'readwrite').objectStore('kv').delete(k); } catch (e) {} }
};
let bgURL = null, bgOn = false;
async function loadBg() { const blob = await idb.get('bg'); if (blob) { if (bgURL) URL.revokeObjectURL(bgURL); bgURL = URL.createObjectURL(blob); bgOn = true; } else { bgURL = null; bgOn = false; } updateBg(); }
function updateBg() { if (!G.bgImg) return; if (bgOn && bgURL) { G.bgImg.setAttribute('href', bgURL); G.bgImg.style.display = ''; G.bgImg.setAttribute('opacity', S.bgOpacity); G.terrain.style.display = S.bgOpacity >= .99 ? 'none' : ''; G.terrain.setAttribute('opacity', 1); } else { G.bgImg.style.display = 'none'; G.terrain.style.display = ''; } world.insertBefore(G.bg, G.roads); }

        <div class="row"><label class="btn pri">${ico('ul')}Choose image<input type="file" accept="image/*" id="bgfile" hidden></label>${bgOn ? `<button class="btn danger" id="bgclr">${ico('trash')}Remove</button>` : ''}</div>
        <div class="field"><label>Image opacity · <span id="bgov">${Math.round(S.bgOpacity * 100)}%</span></label><input type="range" id="bgop" min="0.2" max="1" step="0.05" value="${S.bgOpacity}"></div>
        <div class="row"><button class="btn sm" id="calgo">${ico('move')}Open Calibrate mode</button><button class="btn sm ghost danger" id="posreset">Reset all positions</button></div></div>
      <div class="card stack"><h3>Display & feedback</h3>
        <div class="field"><label>Marker size · <span id="msv">${S.markerScale.toFixed(2)}×</span></label><input type="range" id="ms" min="0.6" max="1.8" step="0.05" value="${S.markerScale}"></div>
        <div class="lrow"><span class="lt"><b>Sound cues</b><span>Jump countdown beeps</span></span><label class="sw"><input type="checkbox" id="snd" ${S.sound ? 'checked' : ''}><i></i></label></div>
        <div class="lrow"><span class="lt"><b>Haptics</b><span>Vibrate on jump (supported phones)</span></span><label class="sw"><input type="checkbox" id="hap" ${S.haptics ? 'checked' : ''}><i></i></label></div></div>
    </div>
    <div class="rule"><span>Physics & timings</span></div>
    <div class="card"><p class="muted" style="font-size:12.5px;margin:0 0 12px">Defaults are calibrated against median real-world air times (≈21 s at the centre, ≈55 s at the far coast). Tune them to your own testing.</p>
      <div class="grid g3">${PHYS.map(([k, l, mn, mx, st, h]) => `<div class="field"><label>${l}</label><input class="inp mono" type="number" data-phys="${k}" min="${mn}" max="${mx}" step="${st}" value="${S[k]}">${h ? `<span class="dim" style="font-size:11.5px">${h}</span>` : ''}</div>`).join('')}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm ghost" id="physreset">Restore defaults</button></div></div>
    <div class="rule"><span>Location data</span></div>
    <div class="card"><p class="muted" style="font-size:12.5px;margin:0 0 10px">Edit any figure — changes apply everywhere instantly and persist. Clearing the “est.” box marks a count as verified.</p>
      <div class="datatable"><table class="t"><thead><tr><th>Location</th><th>Type</th><th>Chests</th><th>est.</th><th>Players/game</th><th>Empty %</th><th>Grid</th></tr></thead><tbody>
      ${NODES.map(n => `<tr><td><b>${esc(n.name)}</b></td><td class="dim">${TYPE_LABEL[n.type]}</td><td><input type="number" min="0" max="200" data-ed="${n.id}" data-f="chests" value="${n.chests}"></td><td><input type="checkbox" data-ed="${n.id}" data-f="est" ${n.est ? 'checked' : ''} style="width:auto"></td><td><input type="number" step="0.01" min="0" max="20" data-ed="${n.id}" data-f="ppg" value="${n.ppg}"></td><td><input type="number" min="0" max="100" data-ed="${n.id}" data-f="empty" value="${n.empty}"></td><td class="mono dim">${gridRef(n.x, n.y)}</td></tr>`).join('')}</tbody></table></div>
      <div class="row" style="margin-top:10px"><button class="btn sm ghost danger" id="datareset">Reset data to defaults</button></div></div>
    <div class="rule"><span>Backup</span></div>
    <div class="card"><div class="row"><button class="btn" id="exp">${ico('dl')}Export everything</button><label class="btn">${ico('ul')}Import backup<input type="file" accept="application/json,.json" id="impf" hidden></label><button class="btn danger" id="wipe">${ico('trash')}Erase all data</button></div>
      <p class="dim" style="font-size:12px;margin:10px 0 0">Exports settings, layers, slots, pins, the working route and calibrated positions as JSON. The map image stays on-device.</p></div>
    <p class="dim" style="font-size:12px;text-align:center;margin-top:24px">Fortnite Dynamic Map v${APP_VERSION} · fan-made tool, not affiliated with Epic Games.</p>
  </div>`;
  const v = $('#v-settings');
  $$('[data-theme-set]', v).forEach(b => b.onclick = () => { setTheme(b.dataset.themeSet); renderSettings(); });
  $('#bgfile').onchange = async e => { const f = e.target.files[0]; if (!f) return; if (f.size > 15e6) { toast('Image too large (max 15 MB)'); return; } const ok = await idb.set('bg', f); if (!ok) { toast('Could not store image on this device'); return; } await loadBg(); renderSettings(); toast('Map image loaded'); };
  if ($('#bgclr')) $('#bgclr').onclick = async () => { await idb.del('bg'); bgOn = false; bgURL = null; updateBg(); renderSettings(); };
  $('#bgop').oninput = e => { S.bgOpacity = +e.target.value; $('#bgov').textContent = Math.round(S.bgOpacity * 100) + '%'; saveSettings(); updateBg(); };
  $('#calgo').onclick = () => { go('map'); setPane('layers'); setMode('calibrate'); };
  $('#posreset').onclick = async () => { if (await ask('Reset positions?', 'All calibrated marker positions return to defaults.', 'Reset', true)) { const ov = store.get('nodeOv', {}); for (const k in ov) { delete ov[k].x; delete ov[k].y; } store.set('nodeOv', ov); buildNodes(); await renderTerrain(true); renderAll(); renderSettings(); toast('Positions reset'); } };
  $('#ms').oninput = e => { S.markerScale = +e.target.value; $('#msv').textContent = S.markerScale.toFixed(2) + '×'; saveSettings(); };
  $('#snd').onchange = e => { S.sound = e.target.checked; saveSettings(); };
  $('#hap').onchange = e => { S.haptics = e.target.checked; saveSettings(); };
  $$('[data-phys]', v).forEach(i => i.onchange = () => { const k = i.dataset.phys, def = PHYS.find(p => p[0] === k); let val = parseFloat(i.value); if (!isFinite(val)) val = DEF_SETTINGS[k]; val = clamp(val, def[2], def[3]); i.value = val; S[k] = val; saveSettings(); renderBus(); });
  $('#physreset').onclick = () => { PHYS.forEach(([k]) => S[k] = DEF_SETTINGS[k]); saveSettings(); renderSettings(); toast('Physics restored'); };
  $$('[data-ed]', v).forEach(i => i.onchange = () => { const n = byId(i.dataset.ed), f = i.dataset.f; let val = f === 'est' ? i.checked : parseFloat(i.value); if (f !== 'est' && !isFinite(val)) return; n[f] = val; saveNodeOv(n.id, { [f]: val }); });
  $('#datareset').onclick = async () => { if (await ask('Reset location data?', 'Chest counts and contest stats return to defaults. Positions are kept.', 'Reset', true)) { const ov = store.get('nodeOv', {}); for (const k in ov) ov[k] = ov[k].x != null ? { x: ov[k].x, y: ov[k].y } : {}; store.set('nodeOv', ov); buildNodes(); renderAll(); renderSettings(); } };
  $('#exp').onclick = () => {
    const data = { app: 'fortnite-dynamic-map', v: APP_VERSION, t: Date.now(), settings: S, layers: LAYERS, enh: ENH, slots: SLOTS, pins: PINS, route: ROUTE, bus: BUS, zone: ZONE, drop: DROP, oracle: oracleOpts, nodeOv: store.get('nodeOv', {}) };
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' })); a.download = `fortnite-dynamic-map-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('#impf').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const d = JSON.parse(await f.text()); if (d.app !== 'fortnite-dynamic-map') throw 0;
      const map = { settings: 'settings', layers: 'layers', enh: 'enh', slots: 'slots', pins: 'pins', route: 'route', bus: 'bus', zone: 'zone', drop: 'drop', oracle: 'oracle', nodeOv: 'nodeOv' };
      for (const k in map) if (d[k] !== undefined) store.set(map[k], d[k]);
      toast('Backup imported — reloading'); setTimeout(() => location.reload(), 700);
    } catch (err) { toast('Not a valid Fortnite Dynamic Map backup'); }
  };
  $('#wipe').onclick = async () => { if (await ask('Erase all data?', 'Removes every saved route, pin, calibration and setting on this device. This cannot be undone.', 'Erase everything', true)) { Object.keys(localStorage).filter(k => k.startsWith(LS)).forEach(k => localStorage.removeItem(k)); await idb.del('bg'); location.reload(); } };
}
function renderLog() {
  $('#v-log').innerHTML = `<div class="page"><div class="eyebrow">Release history</div><h1 style="margin:4px 0 8px">Update log</h1><p class="muted">Every change to Fortnite Dynamic Map, newest first.</p>
    <div class="card" style="margin-top:16px;padding:4px 18px">${CHANGELOG.map(c => `<div class="log-entry"><div><div class="ver">v${c.v}</div><div class="dim" style="font-size:12px">${c.d}</div></div><div><b>${c.v === APP_VERSION ? 'Current release' : 'Release'}</b><ul>${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div></div>`).join('')}</div>
    <div class="rule"><span>Sources</span></div>
    <div class="card muted" style="font-size:13px"><ul style="margin:0;padding-left:18px">
      <li>Fortnite Wiki POI chest/ammo/vending/Reboot counts (via gamertagmythras.com C7S4 map guide)</li>
      <li>Elite Esports — Override map landing data: players/game, uncontested %, median air time</li>
      <li>fortnite.com — “The Corruption Spreads in Fortnitemares 2026” (1 Oct 2026)</li>
      <li>timesaver.gg — Fortnitemares 2026 map changes; digitaltq.com — C7S4 POIs & bosses</li>
      <li>ggseason.com — season end date (1 Nov 2026)</li></ul></div></div>`;
}

/* =====================================================================
   NAV + BOOT
   ===================================================================== */
function setTheme(t) { S.theme = t; saveSettings(); document.documentElement.dataset.theme = t; const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); }
let mapBooted = false;
async function go(v) {
  curView = v; store.set('view', v);
  $$('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  $$('.nav [data-go]').forEach(b => b.classList.toggle('on', b.dataset.go === v));
  if (v !== 'map' && mode !== 'select') setMode('select');
  if (v === 'home') renderHome();
  if (v === 'routes') renderRoutes();
  if (v === 'settings') renderSettings();
  if (v === 'log') renderLog();
  if (v === 'map') {
    if (!mapBooted) { mapBooted = true; renderTabs(); renderPane(); renderEnh(); requestAnimationFrame(() => { fit(); renderAll(); renderTerrain(); }); }
    else requestAnimationFrame(() => { fitKOnly(); applyView(); });
  }
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'Escape') { if ($('#modal').classList.contains('on')) { $('#modal').classList.remove('on'); return; } setMode('select'); }
  if (curView !== 'map') return;
  if (e.key === '+' || e.key === '=') zoomAt(1.4, svg.clientWidth / 2, svg.clientHeight / 2);
  if (e.key === '-') zoomAt(1 / 1.4, svg.clientWidth / 2, svg.clientHeight / 2);
  if (e.key === '0') fit();
  if (e.key.toLowerCase() === 'm') setMode(mode === 'ruler' ? 'select' : 'ruler');
});
$$('.nav [data-go], .brand').forEach(b => b.onclick = () => go(b.dataset.go));

buildNodes();
setTheme(S.theme);
initSVG();
initPointer();
loadBg();
go(store.get('view', 'home'));
if (curView !== 'map') { // pre-render terrain so slot previews have it
  setTimeout(() => { if (!terrainURL) genTerrain().then(u => { G.terrainImg.setAttribute('href', u); if (curView === 'routes') renderRoutes(); }); }, 400);
}

</script>
</body>
</html>
